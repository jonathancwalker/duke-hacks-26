<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Canvas Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Operator screen: set up tonight's event. Same tokens as vibe.css; plain on purpose. */
  :root { --bg: #14110e; --ink: #efe7d8; --dim: #978d7f; --line: #3a332b; --accent: #e6bd6a; --field: #1d1915; --warn: #e48a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font: italic 500 30px/1 "Cormorant Garamond", Georgia, serif; }
  h1 span { color: var(--dim); font-style: normal; font-size: 20px; margin-left: 8px; }
  h2 { margin: 0 0 12px; font: 500 13px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .cols { display: grid; grid-template-columns: 1fr 1.3fr; gap: 28px; }
  section { border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
  label { display: block; margin-bottom: 14px; color: var(--dim); font-size: 13px; }
  label small { display: block; margin-top: 4px; }
  input, select, textarea { display: block; width: 100%; margin-top: 6px; padding: 9px 11px; border: 1px solid var(--line);
                            border-radius: 8px; background: var(--field); color: var(--ink); font: 15px/1.4 Inter, sans-serif; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
  button { font: 500 14px Inter, sans-serif; color: var(--ink); background: transparent; border: 1px solid var(--line);
           padding: 9px 16px; border-radius: 999px; cursor: pointer; }
  button.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .35; cursor: default; }
  .note { color: var(--dim); font-size: 13px; min-height: 19px; margin: 8px 0 0; }
  .note.warn { color: var(--warn); }
  .note.ok { color: var(--accent); }
  #preview { margin-top: 12px; aspect-ratio: 16/9; border: 1px solid var(--line); border-radius: 8px; background: #0c0a08;
             display: grid; place-items: center; overflow: hidden; color: var(--dim); font-size: 13px; text-align: center; padding: 0; }
  #preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #live { color: var(--dim); }
  #live b { color: var(--ink); font-weight: 500; }
  footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap;
           align-items: center; gap: 12px; }
  @media (max-width: 760px) { .cols, .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Living Canvas <span>event setup</span></h1>
    <div id="live">Live now: <b id="live-name">…</b></div>
  </header>
  <div class="cols">
    <section>
      <h2>Tonight</h2>
      <label>Start from a saved event
        <select id="pick"></select>
      </label>
      <label>Event name <input id="name" maxlength="80" autocomplete="off"></label>
      <div class="row">
        <label>Kind
          <select id="kind">
            <option value="concert">Concert</option><option value="festival">Festival</option>
            <option value="conference">Conference</option><option value="museum">Museum</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>Date <input id="date" type="date"></label>
      </div>
      <label>What’s tonight about?
        <textarea id="context" rows="5" maxlength="1200" placeholder="A few sentences: the place, who’s here, what they came for."></textarea>
      </label>
      <div class="btns"><button id="draft" class="main">Draft with Gemini</button></div>
      <p class="note" id="draft-note"></p>
    </section>
    <section>
      <h2>What visitors see</h2>
      <label>Question <small>Visitors answer this out loud while they draw.</small>
        <input id="question" maxlength="160" autocomplete="off">
      </label>
      <label>Base scene <small>The shared painting’s subject. Every visit repaints this scene.</small>
        <textarea id="scene" rows="3" maxlength="400"></textarea>
      </label>
      <div class="btns"><button id="preview-btn">Preview scene</button></div>
      <div id="preview">No preview yet</div>
      <p class="note" id="preview-note"></p>
      <label style="margin-top: 14px">Writing voice <small>Guides the line written after each visit and the closing reflection.</small>
        <textarea id="voice" rows="3" maxlength="400"></textarea>
      </label>
      <label>Closing line <small>Shown after each visit when no written line is ready.</small>
        <input id="closing" maxlength="200" autocomplete="off">
      </label>
    </section>
  </div>
  <footer>
    <button id="save" class="main">Save and go live</button>
    <button id="fresh">Start a fresh night</button>
    <p class="note" id="save-note" style="margin: 0"></p>
  </footer>
</main>
<script type="module" src="/vibe/setup.js"></script>
</body>
</html>
