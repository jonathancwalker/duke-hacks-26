<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Canvas v0</title>
<style>
:root{--bg:#0d0d10;--fg:#f3efe6;--muted:#8a877f;--line:#2a2a30;--accent:#ffb347;--panel:rgba(18,18,22,.82)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#art{position:absolute;inset:0;margin:auto;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block;touch-action:none;cursor:crosshair}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px)}
#hud{top:16px;left:16px;max-width:320px}
#hud h1{font-size:16px;letter-spacing:.04em;font-weight:600}
#hud .sub{color:var(--muted);font-size:12px;margin-top:2px}
#turn{top:16px;right:16px;display:flex;gap:12px;align-items:center}
#ring{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),#2a2a30 0);display:grid;place-items:center}
#ring span{width:34px;height:34px;border-radius:50%;background:#141418;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:13px}
#signals{bottom:16px;left:16px;width:240px}
#signals h2,#cambox h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bar{display:grid;grid-template-columns:56px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.bar i{height:6px;border-radius:3px;background:#2a2a30;position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0;width:0;background:var(--accent);border-radius:3px;transition:width .08s}
.bar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
#status{font-size:11px;color:var(--muted);margin-top:8px}
#cambox{bottom:16px;right:16px;padding:10px}
#camwrap{position:relative;width:220px;height:165px;border-radius:8px;overflow:hidden;background:#000}
#cam,#lm{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
#tools{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px}
button{font:inherit;font-size:13px;color:var(--fg);background:#1d1d23;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:#55555f}
button.primary{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:600}
kbd{font:11px ui-monospace,monospace;color:var(--muted);margin-left:4px}
.modal{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,5,8,.55)}
.modal.on{display:grid}
.card{background:#141418;border:1px solid var(--line);border-radius:14px;padding:22px;max-width:min(720px,92vw);text-align:center}
.card h3{font-size:22px;font-weight:600;margin-bottom:6px}
.card p{color:var(--muted);margin-bottom:16px}
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mood{padding:16px;font-size:16px;text-align:left;display:flex;gap:10px;align-items:center}
.sw{display:flex;gap:3px}.sw s{width:14px;height:14px;border-radius:50%;display:block}
#revealImg{width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:14px}
.row{display:flex;gap:8px;justify-content:center}
@media (max-width:760px){#signals,#cambox{display:none}#tools{flex-wrap:wrap;width:calc(100% - 32px)}}
</style>
</head>
<body>
<canvas id="art" width="1600" height="900"></canvas>

<div id="hud" class="panel">
  <h1>LIVING CANVAS</h1>
  <div class="sub" id="count">0 contributors so far</div>
</div>

<div id="turn" class="panel" hidden>
  <div><div id="who" style="font-weight:600"></div><div class="sub" id="whoMood" style="color:var(--muted);font-size:12px"></div></div>
  <div id="ring"><span id="secs">15</span></div>
</div>

<div id="signals" class="panel">
  <h2>What the model sees</h2>
  <div class="bar">Smile<i><b id="b-smile"></b></i><em id="v-smile">–</em></div>
  <div class="bar">Jaw<i><b id="b-jaw"></b></i><em id="v-jaw">–</em></div>
  <div class="bar">Brow<i><b id="b-brow"></b></i><em id="v-brow">–</em></div>
  <div class="bar">Pinch<i><b id="b-pinch"></b></i><em id="v-pinch">–</em></div>
  <div class="bar">Speed<i><b id="b-speed"></b></i><em id="v-speed">–</em></div>
  <div id="status">Input: mouse (drag to paint)</div>
</div>

<div id="cambox" class="panel">
  <h2>Camera · landmarks</h2>
  <div id="camwrap"><video id="cam" playsinline muted></video><canvas id="lm" width="440" height="330"></canvas></div>
</div>

<div id="tools" class="panel">
  <button id="btnCam">Enable camera</button>
  <button id="btnSim">Simulate crowd ×8</button>
  <button id="btnReplay">Replay<kbd>R</kbd></button>
  <button id="btnSave">Save piece<kbd>S</kbd></button>
  <button id="btnClear">Clear</button>
</div>

<div id="ask" class="modal on">
  <div class="card">
    <h3 id="question">How does tonight feel?</h3>
    <p>Pick one. Then you get 15 seconds to paint with your hands and face.</p>
    <div class="moods" id="moods"></div>
  </div>
</div>

<div id="reveal" class="modal">
  <div class="card">
    <h3>Your moment</h3>
    <p id="revealSub"></p>
    <img id="revealImg" alt="The shared canvas with your contribution highlighted">
    <div class="row"><button id="btnMine">Save my moment</button><button class="primary" id="btnNext">Next person<kbd>Enter</kbd></button></div>
  </div>
</div>

<script type="module">
// ---------- constants ----------
const W = 1600, H = 900, BG = '#0d0d10', TURN_MS = 15000, MAXP = 2600;
const MP_VER = '0.10.14';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const MOODS = [
  { name: 'Electric', hues: [190, 265, 320] },
  { name: 'Calm',     hues: [165, 195, 215] },
  { name: 'Joyful',   hues: [42, 18, 340] },
  { name: 'Restless', hues: [355, 20, 250] },
];

const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

// ---------- Perlin noise (improved) ----------
const P = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + t * (b - a);
const grad = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
function noise(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(P[AA], x, y, z), grad(P[BA], x - 1, y, z), u), lerp(grad(P[AB], x, y - 1, z), grad(P[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(P[AA + 1], x, y, z - 1), grad(P[BA + 1], x - 1, y, z - 1), u), lerp(grad(P[AB + 1], x, y - 1, z - 1), grad(P[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

// ---------- state ----------
const art = $('#art'), actx = art.getContext('2d');
const base = mk(), bctx = base.getContext('2d');
const S = { phase: 'ask', contributors: [], cur: null, turnStart: 0, input: 'mouse', replay: null, busy: false };
const sig = { hands: [], smile: 0, jaw: 0, brow: 0, face: false }; // live signals (camera or mouse)

function newContributor(mood) {
  return { n: S.contributors.length + 1, mood, layer: mk(), parts: [], em: [], seed: Math.random() * 100, t: 0 };
}

// ---------- brush ----------
function spawn(c, e, hand, s, speed) {
  const hues = c.mood.hues, h0 = hues[(Math.random() * hues.length) | 0];
  const spread = 6 + speed * 1.2 + hand.pinch * 30;
  const ang = Math.random() * Math.PI * 2, r = Math.random() * spread;
  const max = 40 + Math.random() * 60 + s.brow * 140;
  c.parts.push({
    x: e.x + Math.cos(ang) * r, y: e.y + Math.sin(ang) * r,
    vx: clamp(e.vx * 0.15, -4, 4) + (Math.random() - 0.5), vy: clamp(e.vy * 0.15, -4, 4) + (Math.random() - 0.5),
    sp: 1.2 + Math.random() * 1.8,
    h: h0 + (Math.random() - 0.5) * 24 + s.smile * 18,
    s: 58 + s.smile * 32, l: 46 + s.smile * 20,
    a: 0.16 + Math.random() * 0.24,
    w: 0.6 + hand.pinch * 3.5 + Math.random() * 1.2 + speed * 0.04,
    life: max, max,
  });
}

// one simulation step for contributor c, given signals s (hands may be empty)
function step(c, s, dt = 16) {
  c.t += dt;
  const ctx = c.layer.getContext('2d');
  s.hands.forEach((hand, i) => {
    let e = c.em[i];
    if (!e) e = c.em[i] = { x: hand.x, y: hand.y, vx: 0, vy: 0 };
    const nx = e.x + (hand.x - e.x) * 0.35, ny = e.y + (hand.y - e.y) * 0.35;
    e.vx = nx - e.x; e.vy = ny - e.y; e.x = nx; e.y = ny;
    const speed = Math.hypot(e.vx, e.vy);
    const n = Math.round(3 + speed * 0.25 + s.jaw * 14);
    for (let k = 0; k < n && c.parts.length < MAXP; k++) spawn(c, e, hand, s, speed);
  });
  if (!s.hands.length) c.em.length = 0;
  ctx.lineCap = 'round';
  const parts = c.parts;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    const a = noise(p.x * 0.0018, p.y * 0.0018, c.t * 0.00012 + c.seed) * Math.PI * 2.5;
    p.vx = p.vx * 0.93 + Math.cos(a) * p.sp * 0.07;
    p.vy = p.vy * 0.93 + Math.sin(a) * p.sp * 0.07;
    const ox = p.x, oy = p.y; p.x += p.vx; p.y += p.vy; p.life--;
    const k = p.life / p.max;
    ctx.strokeStyle = `hsla(${p.h},${p.s}%,${p.l}%,${p.a * k})`;
    ctx.lineWidth = p.w * (0.3 + 0.7 * k);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(p.x, p.y); ctx.stroke();
    if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) { parts[i] = parts[parts.length - 1]; parts.pop(); }
  }
}

function drain(c) { const empty = { hands: [], smile: 0, jaw: 0, brow: 0 }; for (let i = 0; i < 260 && c.parts.length; i++) step(c, empty); }
function bake(c) { bctx.drawImage(c.layer, 0, 0); S.contributors.push(c); updateCount(); }

// ---------- turn flow ----------
function startTurn(mood) {
  S.cur = newContributor(mood); S.phase = 'painting'; S.turnStart = performance.now();
  $('#ask').classList.remove('on');
  $('#turn').hidden = false;
  $('#who').textContent = `Contributor #${S.cur.n}`;
  $('#whoMood').textContent = mood.name;
}
function endTurn() {
  if (S.phase !== 'painting') return;
  const c = S.cur; drain(c); bake(c); S.cur = null; S.phase = 'reveal';
  $('#turn').hidden = true;
  showReveal(c);
}
function showReveal(c) {
  const img = highlight(c);
  $('#revealImg').src = img.toDataURL('image/png');
  $('#revealSub').textContent = `Contributor #${c.n} of ${S.contributors.length} · ${c.mood.name}. Your strokes are lit, everyone else's are dimmed.`;
  $('#reveal').classList.add('on');
  S.lastRevealed = c;
}
function nextPerson() { $('#reveal').classList.remove('on'); S.phase = 'ask'; $('#ask').classList.add('on'); }

function stamp(ctx, text) {
  ctx.font = '500 20px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle = 'rgba(243,239,230,.7)';
  ctx.textAlign = 'right'; ctx.fillText(text, W - 28, H - 26);
}
function highlight(c) {
  const out = mk(), o = out.getContext('2d');
  o.fillStyle = BG; o.fillRect(0, 0, W, H);
  o.globalAlpha = 0.18; for (const k of S.contributors) if (k !== c) o.drawImage(k.layer, 0, 0);
  o.globalAlpha = 1; o.drawImage(c.layer, 0, 0);
  stamp(o, `Living Canvas · #${c.n} of ${S.contributors.length} · ${c.mood.name} · ${new Date().toLocaleDateString()}`);
  return out;
}
function fullPiece() {
  const out = mk(), o = out.getContext('2d');
  o.fillStyle = BG; o.fillRect(0, 0, W, H); o.drawImage(base, 0, 0);
  stamp(o, `Living Canvas · ${S.contributors.length} contributors · ${new Date().toLocaleDateString()}`);
  return out;
}
function download(canvas, name) { const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = name; a.click(); }
function updateCount() { const n = S.contributors.length; $('#count').textContent = `${n} contributor${n === 1 ? '' : 's'} so far`; }

// ---------- crowd simulation (tests composition without people) ----------
async function simulate(n = 8) {
  if (S.busy || S.phase === 'painting') return; S.busy = true;
  for (let j = 0; j < n; j++) {
    const mood = MOODS[(Math.random() * MOODS.length) | 0];
    const c = newContributor(mood); S.cur = c;
    const ax = 1 + Math.random() * 3, ay = 1 + Math.random() * 3, ph = Math.random() * 6.28;
    const cx = W * (0.2 + Math.random() * 0.6), cy = H * (0.25 + Math.random() * 0.5);
    const rx = W * (0.12 + Math.random() * 0.25), ry = H * (0.12 + Math.random() * 0.25);
    const two = Math.random() < 0.4;
    const persona = { smile: Math.random(), jaw: Math.random() * 0.6, brow: Math.random() * 0.8 };
    for (let s = 0; s < 220; s++) {
      const t = s / 220 * Math.PI * 2;
      const pinch = 0.5 + 0.5 * Math.sin(t * 2 + ph);
      const hands = [{ x: cx + Math.sin(ax * t + ph) * rx, y: cy + Math.sin(ay * t) * ry, pinch }];
      if (two) hands.push({ x: cx - Math.sin(ax * t + ph) * rx * 0.8, y: cy + Math.cos(ay * t) * ry, pinch: 1 - pinch });
      step(c, { hands, smile: persona.smile, jaw: persona.jaw * (0.5 + 0.5 * Math.sin(t * 3)), brow: persona.brow });
      if (s % 20 === 0) await nextFrame();
    }
    drain(c); bake(c); S.cur = null;
    await nextFrame();
  }
  S.busy = false;
}

// ---------- replay ----------
function startReplay() { if (!S.contributors.length || S.phase === 'painting') return; S.replay = { t0: performance.now() }; }

// ---------- rendering loop ----------
function render(now) {
  actx.globalAlpha = 1; actx.fillStyle = BG; actx.fillRect(0, 0, W, H);
  if (S.replay) {
    const per = 700, el = now - S.replay.t0, idx = Math.floor(el / per), f = (el % per) / per;
    S.contributors.forEach((c, i) => { if (i < idx) { actx.globalAlpha = 1; actx.drawImage(c.layer, 0, 0); } else if (i === idx) { actx.globalAlpha = f; actx.drawImage(c.layer, 0, 0); } });
    actx.globalAlpha = 1;
    if (idx >= S.contributors.length + 1) S.replay = null;
    return;
  }
  actx.drawImage(base, 0, 0);
  if (S.cur) actx.drawImage(S.cur.layer, 0, 0);
  // live cursors (not baked)
  for (const h of sig.hands) {
    const g = actx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 26 + h.pinch * 30);
    g.addColorStop(0, S.phase === 'painting' ? 'rgba(255,179,71,.55)' : 'rgba(243,239,230,.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    actx.fillStyle = g; actx.beginPath(); actx.arc(h.x, h.y, 26 + h.pinch * 30, 0, Math.PI * 2); actx.fill();
  }
}

let lastHand = null;
function setBars() {
  const speed = lastHand ? clamp(lastHand.speed / 40) : 0;
  const pinch = sig.hands[0] ? sig.hands[0].pinch : 0;
  const vals = { smile: sig.smile, jaw: sig.jaw, brow: sig.brow, pinch, speed };
  for (const [k, v] of Object.entries(vals)) { $('#b-' + k).style.width = (v * 100).toFixed(0) + '%'; $('#v-' + k).textContent = v.toFixed(2); }
}

function loop(now) {
  if (S.input === 'cam') detect(now);
  // hand speed for HUD
  if (sig.hands[0]) { const h = sig.hands[0]; lastHand = lastHand ? { x: h.x, y: h.y, speed: lastHand.speed * 0.7 + Math.hypot(h.x - lastHand.x, h.y - lastHand.y) * 0.3 } : { x: h.x, y: h.y, speed: 0 }; } else lastHand = null;
  if (S.phase === 'painting') {
    step(S.cur, sig);
    const el = now - S.turnStart, p = clamp(el / TURN_MS);
    $('#ring').style.setProperty('--p', p);
    $('#secs').textContent = Math.ceil((TURN_MS - el) / 1000);
    if (el >= TURN_MS) endTurn();
  }
  render(now); setBars();
  requestAnimationFrame(loop);
}

// ---------- mouse input ----------
let mouseDown = false;
function toCanvas(e) { const r = art.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
art.addEventListener('pointerdown', e => { if (S.input !== 'mouse') return; mouseDown = true; const p = toCanvas(e); sig.hands = [{ ...p, pinch: 0.4 }]; });
art.addEventListener('pointermove', e => { if (S.input !== 'mouse' || !mouseDown) return; const p = toCanvas(e); sig.hands = [{ ...p, pinch: 0.4 }]; });
addEventListener('pointerup', () => { if (S.input !== 'mouse') return; mouseDown = false; sig.hands = []; });

// ---------- camera + MediaPipe ----------
const video = $('#cam'), lm = $('#lm'), lctx = lm.getContext('2d');
let handLM = null, faceLM = null, lastVT = -1, frameN = 0, lastFace = null;
const mapX = v => clamp(((1 - v) - 0.12) / 0.76) * W;   // mirror + use central 76% of frame
const mapY = v => clamp((v - 0.1) / 0.75) * H;
const status = t => { $('#status').textContent = t; };

async function enableCamera() {
  if (S.input === 'cam') return;
  $('#btnCam').disabled = true;
  try {
    status('Starting camera…');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    video.srcObject = stream; await video.play();
    status('Loading hand + face models…');
    const { FilesetResolver, HandLandmarker, FaceLandmarker } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
    const fs = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
    [handLM, faceLM] = await Promise.all([
      HandLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: HAND_MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numHands: 2 }),
      FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: FACE_MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true }),
    ]);
    S.input = 'cam'; sig.hands = [];
    status('Input: camera · MediaPipe hands ×2 + face (52 blendshapes)');
    $('#btnCam').textContent = 'Camera on';
  } catch (err) {
    console.error(err);
    status('Camera/models unavailable: ' + (err.message || err) + '. Using mouse.');
    $('#btnCam').disabled = false;
  }
}

function detect(now) {
  if (!handLM || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime; frameN++;
  const hr = handLM.detectForVideo(video, now);
  if (frameN % 2 === 0) lastFace = faceLM.detectForVideo(video, now);
  // hands
  sig.hands = (hr.landmarks || []).map(L => {
    const tip = L[8], th = L[4], size = Math.hypot(L[0].x - L[9].x, L[0].y - L[9].y) || 0.1;
    const pinch = clamp((Math.hypot(tip.x - th.x, tip.y - th.y) / size - 0.15) / 0.9);
    return { x: mapX(tip.x), y: mapY(tip.y), pinch };
  });
  // face blendshapes
  const bs = lastFace?.faceBlendshapes?.[0]?.categories;
  if (bs) {
    const g = n => bs.find(c => c.categoryName === n)?.score ?? 0;
    const ease = (a, b) => a * 0.6 + b * 0.4;
    sig.smile = ease(sig.smile, clamp((g('mouthSmileLeft') + g('mouthSmileRight')) / 2 * 1.3));
    sig.jaw = ease(sig.jaw, clamp(g('jawOpen') * 1.4));
    sig.brow = ease(sig.brow, clamp(g('browInnerUp') * 1.5));
    sig.face = true;
  } else sig.face = false;
  // landmark overlay
  lctx.clearRect(0, 0, lm.width, lm.height);
  lctx.fillStyle = 'rgba(255,179,71,.95)';
  for (const L of hr.landmarks || []) for (const p of L) { lctx.beginPath(); lctx.arc(p.x * lm.width, p.y * lm.height, 3, 0, 7); lctx.fill(); }
  lctx.fillStyle = 'rgba(243,239,230,.55)';
  const F = lastFace?.faceLandmarks?.[0];
  if (F) for (let i = 0; i < F.length; i += 3) lctx.fillRect(F[i].x * lm.width, F[i].y * lm.height, 1.5, 1.5);
}

// ---------- UI wiring ----------
$('#moods').innerHTML = MOODS.map((m, i) =>
  `<button class="mood" data-i="${i}"><span class="sw">${m.hues.map(h => `<s style="background:hsl(${h},75%,58%)"></s>`).join('')}</span>${m.name}<kbd>${i + 1}</kbd></button>`).join('');
$('#moods').addEventListener('click', e => { const b = e.target.closest('.mood'); if (b && S.phase === 'ask') startTurn(MOODS[+b.dataset.i]); });
$('#btnNext').onclick = nextPerson;
$('#btnMine').onclick = () => S.lastRevealed && download(highlight(S.lastRevealed), `living-canvas-${S.lastRevealed.n}.png`);
$('#btnCam').onclick = enableCamera;
$('#btnSim').onclick = () => simulate(8);
$('#btnReplay').onclick = startReplay;
$('#btnSave').onclick = () => download(fullPiece(), 'living-canvas.png');
$('#btnClear').onclick = () => { if (S.phase === 'painting' || S.busy) return; S.contributors = []; bctx.clearRect(0, 0, W, H); updateCount(); };
addEventListener('keydown', e => {
  if (S.phase === 'ask' && /^[1-4]$/.test(e.key)) startTurn(MOODS[+e.key - 1]);
  else if (S.phase === 'painting' && e.key === ' ') endTurn();
  else if (S.phase === 'reveal' && e.key === 'Enter') nextPerson();
  else if (e.key === 'r' || e.key === 'R') startReplay();
  else if (e.key === 's' || e.key === 'S') download(fullPiece(), 'living-canvas.png');
});

window.__lc = { S, sig, simulate, startTurn, endTurn, MOODS }; // debug handle
requestAnimationFrame(loop);
</script>
</body>
</html>
