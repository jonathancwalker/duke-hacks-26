<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Canvas Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Booth: the painting fills the screen; a low panel guides the visitor; capture happens in a 10-second window. */
:root{--bg:#0b0a0d;--ink:#f1ece2;--ink2:#a7a1ae;--amber:#ffb347;--panel:rgba(14,13,18,.82);--rule:rgba(255,255,255,.14);
  --display:"Syne","Avenir Next",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center}
.paint{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity 1.4s ease}
#label{position:absolute;left:24px;top:20px;max-width:520px;display:grid;gap:4px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#label b{font:800 26px/1.05 var(--display)}
#label span{font:12px var(--mono);color:var(--ink2)}
#caption{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);max-width:min(900px,90vw);text-align:center;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 18px;display:none}
#caption.on{display:block}
#caption .q{display:block;font:500 20px/1.35 var(--body)}
#caption small{display:block;margin-top:6px;font:12px var(--mono);color:var(--ink2)}
#panel{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(1100px,94vw);background:var(--panel);
  border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:200px 1fr auto;gap:16px;align-items:center;backdrop-filter:blur(8px)}
#camwrap{position:relative;width:200px;height:112px;border-radius:8px;overflow:hidden;background:#000}
#cam,#skel{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.meters{display:grid;gap:6px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.m{display:grid;grid-template-columns:78px 1fr 46px;gap:8px;align-items:center;font:12px var(--mono);color:var(--ink2)}
.m i{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;display:block}
.m i b{display:block;height:100%;width:0;background:var(--amber);transition:width .1s}
#transcript{font-size:14px;min-height:1.5em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font:12px var(--mono);color:var(--ink2)}
button{font:600 15px var(--body);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--rule);border-radius:8px;padding:10px 16px;cursor:pointer}
button.go{background:var(--amber);color:#1a1206;border-color:var(--amber);font-size:17px;padding:14px 22px}
button:disabled{opacity:.45;cursor:default}
#typed{font:14px var(--body);background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
#ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--amber) calc(var(--p,0)*1turn),rgba(255,255,255,.12) 0);display:grid;place-items:center}
#ring span{width:52px;height:52px;border-radius:50%;background:#141218;display:grid;place-items:center;font:500 18px var(--mono)}
#strip{position:absolute;right:20px;top:20px;display:flex;gap:6px;max-width:50vw;overflow:hidden;flex-direction:row-reverse}
#strip img{width:96px;height:54px;object-fit:cover;border-radius:4px;border:1px solid var(--rule);opacity:.85}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <img id="imgA" class="paint" alt="The crowd painting">
  <img id="imgB" class="paint" alt="" style="opacity:0">
  <div id="label"><b>Living Canvas</b><span id="sub">Say what's on your mind. Move however you feel.</span></div>
  <div id="strip"></div>
  <div id="caption"><span class="q" id="capWords"></span><small id="capMeta"></small></div>

  <div id="panel">
    <div id="camwrap"><video id="cam" playsinline muted></video><canvas id="skel" width="320" height="180"></canvas></div>
    <div class="meters">
      <div class="m">voice<i><b id="mVoice"></b></i><em id="vVoice">–</em></div>
      <div class="m">movement<i><b id="mMove"></b></i><em id="vMove">–</em></div>
      <div id="transcript"></div>
      <input id="typed" class="hidden" placeholder="No mic or speech here? Type what you'd say, then press Step up">
      <div id="status">Starting…</div>
    </div>
    <div class="row">
      <div id="ring" class="hidden"><span id="secs">10</span></div>
      <button class="go" id="btnGo" disabled>Step up</button>
      <button id="btnSim" title="Test the pipeline without a person">Simulate</button>
    </div>
  </div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const clamp = (v, a = -1, b = 1) => Math.max(a, Math.min(b, v));
const lin = (v, lo, hi) => clamp((v - lo) / (hi - lo) * 2 - 1);            // map [lo,hi] -> [-1,1]
const CAPTURE_MS = 10000;
let busy = false;

// ---------------- painting display ----------------
let front = $('#imgA'), back = $('#imgB');
function showPainting(src) {
  return new Promise(res => { back.onload = () => { back.style.opacity = 1; front.style.opacity = 0; [front, back] = [back, front]; setTimeout(res, 1400); }; back.src = src; });
}
function addThumb(src) { const i = new Image(); i.src = src; i.alt = 'A past visitor moment'; $('#strip').prepend(i); while ($('#strip').children.length > 8) $('#strip').lastChild.remove(); }
const status = t => { $('#status').textContent = t; };

// ---------------- camera + pose (Laban effort from wrists) ----------------
const video = $('#cam'), sk = $('#skel').getContext('2d');
let pose = null, camOK = false, track = [];   // track: {t, l:[x,y]|null, r:[x,y]|null}
async function initCamera() {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: false });
    await video.play(); camOK = true;
    const { FilesetResolver, PoseLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    pose = await PoseLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath:
      'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numPoses: 1 });
  } catch (e) { console.warn('camera/pose unavailable', e); }
}
let lastVT = -1, capturing = false;
function poseLoop(now) {
  if (pose && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    const r = pose.detectForVideo(video, now), L = r.landmarks?.[0];
    sk.clearRect(0, 0, 320, 180);
    if (L) {
      sk.fillStyle = 'rgba(255,179,71,.9)';
      for (const i of [11, 12, 13, 14, 15, 16]) { const p = L[i]; if (p.visibility > .5) { sk.beginPath(); sk.arc(p.x * 320, p.y * 180, i > 14 ? 5 : 3, 0, 7); sk.fill(); } }
      if (capturing) track.push({ t: now / 1000, l: L[15].visibility > .5 ? [L[15].x, L[15].y] : null, r: L[16].visibility > .5 ? [L[16].x, L[16].y] : null });
    }
    if (capturing) { const f = labanFrom(track.slice(-30)); setMeter('Move', f.motion); }
  }
  requestAnimationFrame(poseLoop);
}

/** Laban effort from wrist paths (normalized image coords, seconds).
 *  weight: peak acceleration (light .. strong) · time: share of sudden accelerations (sustained .. sudden)
 *  space: path straightness over 1 s windows (indirect .. direct) · flow: range of motion (bound .. free) */
// Centered moving average over ±k samples. Landmark jitter is amplified twice by differentiating to acceleration,
// so without this every movement read as maximally strong and sudden (calibration run 1: all Laban values pinned at ±1).
function smoothPath(s, k = 2) {
  return s.map((f, i) => { let x = 0, y = 0, n = 0;
    for (let j = Math.max(0, i - k); j <= Math.min(s.length - 1, i + k); j++) { x += s[j].p[0]; y += s[j].p[1]; n++; }
    return { t: f.t, p: [x / n, y / n] }; });
}
function labanFrom(tr) {
  const out = { weight: 0, time: 0, space: 0, flow: 0, motion: 0, detected: false, still: false, raw: null };
  const accs = [], speeds = [], straight = [], pts = [];
  for (const side of ['l', 'r']) {
    const s = smoothPath(tr.filter(f => f[side]).map(f => ({ t: f.t, p: f[side] })));
    if (s.length < 8) continue;
    out.detected = true;
    let v = [];
    for (let i = 1; i < s.length; i++) { const dt = Math.max(1 / 60, s[i].t - s[i - 1].t); v.push({ t: s[i].t, v: [(s[i].p[0] - s[i - 1].p[0]) / dt, (s[i].p[1] - s[i - 1].p[1]) / dt] }); pts.push(s[i].p); }
    v = v.map((x, i) => { const a = v[Math.max(0, i - 1)], b = v[Math.min(v.length - 1, i + 1)]; return { t: x.t, v: [(a.v[0] + x.v[0] + b.v[0]) / 3, (a.v[1] + x.v[1] + b.v[1]) / 3] }; });
    for (let i = 1; i < v.length; i++) { const dt = Math.max(1 / 60, v[i].t - v[i - 1].t); accs.push(Math.hypot(v[i].v[0] - v[i - 1].v[0], v[i].v[1] - v[i - 1].v[1]) / dt); }
    for (const x of v) speeds.push(Math.hypot(...x.v));
    for (let i = 0; i + 30 < s.length; i += 15) {
      let path = 0; for (let k = i + 1; k <= i + 30; k++) path += Math.hypot(s[k].p[0] - s[k - 1].p[0], s[k].p[1] - s[k - 1].p[1]);
      const disp = Math.hypot(s[i + 30].p[0] - s[i].p[0], s[i + 30].p[1] - s[i].p[1]);
      if (path > 0.05) straight.push(disp / path);
    }
  }
  if (!out.detected) {
    // Body visible but hands out of frame or down at the sides: that's stillness, not absence (calibration run 1).
    if (tr.length >= 30) Object.assign(out, { detected: true, still: true, weight: -0.6, time: -0.7, space: 0, flow: -0.3, motion: 0 });
    return out;
  }
  const sorted = accs.slice().sort((a, b) => a - b), p95 = sorted[Math.floor(sorted.length * .95)] || 0;
  const meanSpeed = speeds.reduce((a, b) => a + b, 0) / Math.max(1, speeds.length);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const extent = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  const sudden = accs.filter(a => a > 10).length / Math.max(1, accs.length);
  const straightness = straight.length ? straight.reduce((a, b) => a + b, 0) / straight.length : null;
  // Ranges fit to four calibration runs (small / normal / loud-animated gave p95 20.7 / 38.9 / 46.5,
  // sudden .16 / .32 / .88, straightness .58 / .22 / .20, extent 1.07 / 1.22 / 1.70, speed .47 / .84 / 2.57).
  // Extent pools both wrists, so it includes the distance between the hands; hence the high floor.
  out.weight = lin(p95, 12, 50);
  out.time = lin(sudden, 0.05, 0.75);
  out.space = straightness == null ? 0 : lin(straightness, 0.15, 0.75);
  out.flow = lin(extent, 0.9, 1.8);
  out.motion = clamp(meanSpeed / 2.5, 0, 1);
  out.raw = { p95: +p95.toFixed(2), sudden: +sudden.toFixed(3), straightness: straightness == null ? null : +straightness.toFixed(2),
              extent: +extent.toFixed(2), speed: +meanSpeed.toFixed(2), samples: pts.length };
  return out;
}

// ---------------- mic: vocal arousal from loudness, pitch movement and syllable rate ----------------
let audio = null, frames = [];
async function initMic() {
  try {
    // Browser voice processing evens out volume (small and normal voice both measured ~-29 dB), so turn it off:
    // loudness is the main arousal signal and has to be the real one.
    const stream = await navigator.mediaDevices.getUserMedia({ video: false,
      audio: { autoGainControl: false, noiseSuppression: false, echoCancellation: false } });
    const ctx = new AudioContext(), src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
    an.fftSize = 2048; src.connect(an); audio = { ctx, an, buf: new Float32Array(2048) };
  } catch (e) { console.warn('mic unavailable', e); }
}
// Normalized autocorrelation pitch, 80-400 Hz. Takes the SHORTEST lag within 90% of the best peak: raw "max peak"
// often lands on a multiple of the true period (octave errors), which inflated pitch spread to 6-7 semitones.
function pitchOf(buf, sr) {
  const N = 1024, lo = Math.floor(sr / 400), hi = Math.floor(sr / 80), r = new Float32Array(hi + 1);
  let e0 = 0; for (let i = 0; i < N; i++) e0 += buf[i] * buf[i];
  let best = 0;
  for (let lag = lo; lag <= hi; lag++) {
    let c = 0, e1 = 0; for (let i = 0; i < N; i++) { c += buf[i] * buf[i + lag]; e1 += buf[i + lag] * buf[i + lag]; }
    r[lag] = c / Math.sqrt(e0 * e1 + 1e-12); if (r[lag] > best) best = r[lag];
  }
  if (best < 0.5) return 0;                              // not clearly periodic: treat as unvoiced
  for (let lag = lo + 1; lag < hi; lag++) if (r[lag] >= 0.9 * best && r[lag] >= r[lag - 1] && r[lag] >= r[lag + 1]) return sr / lag;
  return 0;
}
function audioTick() {
  if (!audio || !capturing) return;
  audio.an.getFloatTimeDomainData(audio.buf);
  let s = 0; for (const x of audio.buf) s += x * x;
  const db = 10 * Math.log10(s / audio.buf.length + 1e-10), voiced = db > -45;
  frames.push({ t: performance.now() / 1000, db, f0: voiced ? pitchOf(audio.buf, audio.ctx.sampleRate) : 0 });
  setMeter('Voice', clamp((db + 55) / 35, 0, 1));
}
function prosodyFrom(fr) {
  const v = fr.filter(f => f.f0 > 0);
  if (v.length < 5) return { arousal: 0.3, loud: null, pitchVar: null, rate: null, voiced: v.length / Math.max(1, fr.length) };
  const loud = v.reduce((a, f) => a + f.db, 0) / v.length;
  const all = v.map(f => 12 * Math.log2(f.f0 / 100)).sort((a, b) => a - b), med = all[Math.floor(all.length / 2)];
  const semis = all.filter(s => Math.abs(s - med) <= 7);   // drop leftover octave jumps before measuring spread
  const m = semis.reduce((a, b) => a + b, 0) / Math.max(1, semis.length);
  const pitchVar = Math.sqrt(semis.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(1, semis.length));
  let peaks = 0; for (let i = 1; i < fr.length - 1; i++) if (fr[i].db > -40 && fr[i].db > fr[i - 1].db + 3 && fr[i].db >= fr[i + 1].db) peaks++;
  const dur = fr[fr.length - 1].t - fr[0].t || 1, rate = peaks / dur;
  // Fit with browser voice processing off: whisper -40.8 dB, loud -24.2 dB. Loudness carries it. Pitch spread is
  // unreliable on quiet voices (the whisper measured 2.9 semitones vs 2.5 loud) and rate barely moved, so both are minor.
  const arousal = clamp(0.75 * (lin(loud, -41, -25) + 1) / 2 + 0.1 * (lin(pitchVar, 1.8, 3.4) + 1) / 2 + 0.15 * (lin(rate, 1, 2.6) + 1) / 2, 0, 1);
  return { arousal, loud: +loud.toFixed(1), pitchVar: +pitchVar.toFixed(2), rate: +rate.toFixed(2), voiced: +(v.length / fr.length).toFixed(2) };
}

// ---------------- speech to text (Chrome) ----------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = '', interim = '';
function startSpeech() {
  finalText = ''; interim = '';
  if (!SR) return;
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  rec.onresult = e => { interim = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += t + ' '; else interim += t; }
    const n = (finalText + interim).trim().split(/\s+/).filter(Boolean).length;   // words stay private: show a count
    $('#transcript').textContent = n ? `Hearing you… ${n} word${n === 1 ? '' : 's'}` : ''; };
  rec.onerror = e => console.warn('speech', e.error);
  try { rec.start(); } catch {}
}
// Chrome delivers the last final result shortly after stop(); wait for onend (max 1.2 s) so the caption isn't cut off.
function stopSpeech() {
  if (!rec) return Promise.resolve((finalText + ' ' + interim).trim());
  return new Promise(res => {
    const done = () => res((finalText + ' ' + interim).trim());
    const timer = setTimeout(done, 1200);
    rec.onend = () => { clearTimeout(timer); done(); };
    try { rec.stop(); } catch { clearTimeout(timer); done(); }
  });
}

function setMeter(k, v) { $('#m' + k).style.width = (v * 100).toFixed(0) + '%'; $('#v' + k).textContent = v.toFixed(2); }

// ---------------- a visit ----------------
async function capture() {
  track = []; frames = []; capturing = true; startSpeech();
  $('#ring').classList.remove('hidden'); $('#btnGo').disabled = true; $('#btnSim').disabled = true;
  status('Listening and watching… say what’s on your mind, move how you feel');
  const t0 = performance.now(), audioTimer = setInterval(audioTick, 50);
  await new Promise(res => { const tick = () => { const p = (performance.now() - t0) / CAPTURE_MS; $('#ring').style.setProperty('--p', Math.min(1, p)); $('#secs').textContent = Math.max(0, Math.ceil((1 - p) * 10)); p >= 1 ? res() : requestAnimationFrame(tick); }; tick(); });
  capturing = false; clearInterval(audioTimer);
  let transcript = await stopSpeech(); if (!transcript && !$('#typed').classList.contains('hidden')) transcript = $('#typed').value.trim();
  $('#ring').classList.add('hidden');
  return { transcript, prosody: prosodyFrom(frames), laban: labanFrom(track) };
}

async function sendVisit(v) {
  busy = true; $('#btnGo').disabled = true; $('#btnSim').disabled = true;
  status('Reading you… then painting');
  try {
    const r = await fetch('/api/visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(v) }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    const d = r.director, i = r.info;
    // Privacy: the big screen never shows a visitor's words, only the director's museum-style reading.
    const reading = (d.reading || '').trim();
    $('#capWords').textContent = reading ? reading[0].toUpperCase() + reading.slice(1) : 'A moment without words';
    // Hybrid placement names the paintings in the visitor's mix; axes-only falls back to the nearest paintings.
    const mixText = list => list.map(([n, w]) => `${Math.round(w * 100)}% ${n}`).join(' · ');
    const axesText = `energy ${d.energy.toFixed(1)}, warmth ${d.temperature.toFixed(1)}, light ${d.value.toFixed(1)}`;
    $('#capMeta').textContent = (i.you_mix && i.you_mix.length)
      ? `${mixText(i.you_mix)} · ${axesText}`
      : `closest to ${i.you_nearest.join(' and ')} · ${axesText}`;
    $('#caption').classList.add('on');
    $('#sub').textContent = 'Your moment';
    await showPainting(r.moment); addThumb(r.moment);
    status(`Director: ${d.source} in ${r.timing.director_s}s · painting ${r.timing.gpu_s}s · visitor ${i.n}`);
    await new Promise(res => setTimeout(res, 7000));
    $('#caption').classList.remove('on');
    $('#sub').textContent = `The crowd after ${i.n} visitor${i.n === 1 ? '' : 's'} · ` +
      ((i.crowd_mix && i.crowd_mix.length) ? mixText(i.crowd_mix) : `closest to ${i.crowd_nearest.join(' and ')}`);
    await showPainting(r.crowd);
  } catch (e) { status('Something went wrong: ' + e.message); console.error(e); }
  busy = false; $('#btnGo').disabled = false; $('#btnSim').disabled = false;
}

$('#btnGo').onclick = async () => { if (!busy) sendVisit(await capture()); };
const SIMS = [
  { transcript: "Missing my grandma tonight.", prosody: { arousal: 0.15 }, laban: { weight: -0.7, time: -0.8, space: -0.6, flow: 0.6, detected: true } },
  { transcript: "I'm angry about how things are going.", prosody: { arousal: 0.95 }, laban: { weight: 0.9, time: 0.9, space: 0.9, flow: -0.9, detected: true } },
  { transcript: "Everyone I love is in this room right now!", prosody: { arousal: 0.8 }, laban: { weight: -0.6, time: 0.7, space: -0.5, flow: 0.8, detected: true } },
  { transcript: "First snow of the year on the walk here.", prosody: { arousal: 0.3 }, laban: { weight: -0.6, time: -0.5, space: -0.4, flow: 0.5, detected: true } },
];
let simI = 0;
$('#btnSim').onclick = () => { if (!busy) sendVisit(SIMS[simI++ % SIMS.length]); };

// ---------------- boot ----------------
(async () => {
  status('Connecting to the painting…');
  try {
    const h = await fetch('/api/health').then(r => r.json());
    if (h.lab !== 'ok') { status('GPU lab is not reachable: ' + h.lab); }
    const cur = await fetch('/api/current', { method: 'POST' }).then(r => r.json());
    if (cur.crowd) { await showPainting(cur.crowd); $('#sub').textContent = cur.n ? `The crowd after ${cur.n} visitors` : 'Say what’s on your mind. Move however you feel.'; }
    status(`Ready · director: ${h.director}`);
  } catch (e) { status('Booth server error: ' + e.message); }
  await Promise.all([initCamera(), initMic()]);
  if (!SR || !audio) $('#typed').classList.remove('hidden');
  status(`${$('#status').textContent} · camera ${pose ? 'on' : 'off'} · mic ${audio ? 'on' : 'off'} · speech ${SR ? 'on' : 'off'}`);
  $('#btnGo').disabled = false;
  requestAnimationFrame(poseLoop);
})();
</script>
</body>
</html>
