<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Momento Booth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Momento booth. The crowd painting fills the screen. While a visitor takes a turn, a charcoal silk surface covers it and one still card
   carries the whole visit: the question with a round Start button, then 3·2·1 in the same card, then the camera with Vol and Move bars.
   When the turn ends the silk and card lift away and the painting answers. */
      :root {
        --bg: #0b0a0d;
        --card: #252421;
        --fg: #f1ede6;
        --muted: #a09a90;
        --line: rgba(241, 237, 230, 0.16);
        --font: "Helvetica Neue", Helvetica, "Inter Tight", Arial, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --ink: #f1ece2;
        --ink2: #a7a1ae;
        --panel: rgba(14, 13, 18, 0.82);
        --rule: rgba(255, 255, 255, 0.14);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--font);
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 4px;
      }
      .hidden {
        display: none !important;
      }
      [hidden] {
        display: none !important;
      }

      /* the painting and its wall furniture */
      #stage {
        position: fixed;
        inset: 0;
      }
      .paint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: opacity 1.4s ease;
      }
      .paint:not([src]) {
        visibility: hidden;
      }
      #label {
        position: absolute;
        left: 28px;
        top: 22px;
        max-width: 560px;
        display: grid;
        gap: 2px;
        z-index: 3;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }
      #label b {
        font: 700 22px/1 var(--font);
        letter-spacing: -0.03em;
      }
      #label span {
        font: 12px var(--mono);
        color: var(--ink2);
      }
      #strip {
        position: absolute;
        right: 24px;
        top: 22px;
        display: flex;
        gap: 6px;
        max-width: 50vw;
        overflow: hidden;
        flex-direction: row-reverse;
        z-index: 3;
      }
      #strip img {
        width: 96px;
        height: 54px;
        object-fit: cover;
        border: 1px solid var(--rule);
        border-radius: 6px;
        opacity: 0.9;
      }
      #caption {
        position: absolute;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        max-width: min(820px, 86vw);
        z-index: 3;
        background: rgba(37, 36, 33, 0.92);
        color: var(--fg);
        padding: 16px 22px;
        border-radius: 16px;
        display: none;
        text-align: center;
      }
      #caption.on {
        display: block;
      }
      #caption .q {
        display: block;
        font: 700 26px/1.2 var(--font);
        letter-spacing: -0.03em;
      }
      #caption small {
        display: block;
        margin-top: 6px;
        font: 12px var(--mono);
        color: var(--muted);
      }

      /* the veil: charcoal silk plus the card, over the painting */
      #veil {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: clamp(12px, 2.5vh, 28px) clamp(12px, 2.5vw, 32px);
        transition: opacity 0.7s ease;
      }
      #veil.off {
        opacity: 0;
        pointer-events: none;
      }
      #silk {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .card {
        position: relative;
        width: min(1060px, 82vw);
        aspect-ratio: 16/10;
        max-height: 78vh;
        background: var(--card);
        color: var(--fg);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.8);
      }
      .brand {
        position: absolute;
        left: clamp(22px, 3vw, 40px);
        top: clamp(18px, 2.6vw, 34px);
        font: 500 12px/1 var(--font);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        z-index: 2;
      }
      .scr {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: clamp(22px, 3.4vh, 36px);
        padding: clamp(56px, 6vw, 80px) clamp(24px, 5vw, 64px)
          clamp(28px, 4vw, 52px);
        text-align: center;
        transition: opacity 0.4s ease;
      }
      .scr.off {
        opacity: 0;
        pointer-events: none;
      }

      /* 1 · question */
      .q-big {
        font: 700 clamp(44px, 6.4vw, 96px)/1 var(--font);
        letter-spacing: -0.045em;
        max-width: 12ch;
        text-wrap: balance;
      }
      .go {
        width: clamp(112px, 10vw, 148px);
        height: clamp(112px, 10vw, 148px);
        border-radius: 50%;
        border: 0;
        background: var(--fg);
        color: var(--card);
        font: 700 clamp(16px, 1.4vw, 19px)/1 var(--font);
        letter-spacing: -0.02em;
        cursor: pointer;
        position: relative;
        transition: transform 0.25s cubic-bezier(0.3, 1.5, 0.5, 1);
      }
      .go::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(241, 237, 230, 0.35);
        animation: ring 2.4s ease-out infinite;
      }
      .go:hover:not(:disabled) {
        transform: scale(1.06);
      }
      .go:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .go:disabled::after {
        animation: none;
        opacity: 0;
      }
      @keyframes ring {
        0% {
          transform: scale(0.9);
          opacity: 1;
        }
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }
      #typed {
        width: min(560px, 100%);
        font: 400 17px var(--font);
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        color: var(--fg);
        text-align: center;
      }
      #typed::placeholder {
        color: var(--muted);
      }

      /* 2 · countdown, inside the card */
      .n {
        font: 700 clamp(160px, 24vw, 320px)/1 var(--font);
        letter-spacing: -0.05em;
        color: var(--fg);
      }
      .n.pop {
        animation: pop 0.95s ease-out;
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.75);
        }
        22% {
          opacity: 1;
          transform: scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.08);
        }
      }

      /* 3 · capture: camera on top, Vol and Move bars below */
      .cap {
        position: absolute;
        inset: clamp(44px, 4.4vw, 60px) clamp(16px, 2vw, 28px)
          clamp(14px, 1.8vw, 22px);
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: clamp(10px, 1.4vw, 16px);
        justify-items: center;
        text-align: left;
      }
      #camwrap {
        position: relative;
        height: 100%;
        aspect-ratio: 16/9;
        max-width: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: #1b1a18;
        border: 1px solid var(--line);
      }
      #cam,
      #skel {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      #cam {
        filter: saturate(0.85);
      }
      .rec {
        position: absolute;
        right: 12px;
        top: 10px;
        font: 700 20px/1 var(--font);
        letter-spacing: -0.02em;
        color: var(--fg);
      }
      #secs {
        font-variant-numeric: tabular-nums;
      }
      #transcript {
        position: absolute;
        left: 12px;
        top: 12px;
        font: 400 12px var(--font);
        color: var(--muted);
      }
      #transcript:empty {
        display: none;
      }
      .timebar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: rgba(241, 237, 230, 0.12);
      }
      .timebar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--fg);
      }
      .meters {
        width: min(900px, 100%);
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 10px 16px;
        align-items: center;
      }
      .ml {
        font: 400 15px/1 var(--font);
        color: var(--muted);
      }
      .meters canvas {
        width: 100%;
        height: 30px;
        display: block;
      }

      /* event setup: operator only */
      #admin {
        position: fixed;
        z-index: 6;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(400px, 100%);
        overflow-y: auto;
        background: #1e1d1b;
        color: var(--fg);
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font: 400 14px/1.4 var(--font);
        box-shadow: -30px 0 60px -30px rgba(0, 0, 0, 0.7);
      }
      #admin .ahead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      #admin .ahead b {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #admin .aclose {
        font-size: 22px;
        line-height: 1;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 4px 8px;
      }
      #admin label {
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
      }
      #admin input {
        font: 400 15px/1.3 var(--font);
        color: var(--fg);
        background: #272623;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 11px 12px;
        width: 100%;
      }
      #admin .agen,
      #admin .ause {
        font: 600 15px/1 var(--font);
        color: #1e1d1b;
        background: var(--fg);
        border: 0;
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
      }
      #admin .agen:disabled {
        opacity: 0.5;
      }
      #admin .astatus {
        color: var(--muted);
        font-size: 13px;
        min-height: 1.2em;
      }
      #admin .aopts {
        display: grid;
        gap: 8px;
      }
      #admin .aopts button {
        text-align: left;
        font: 500 15px/1.3 var(--font);
        color: var(--fg);
        background: #272623;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
      }
      #admin .aopts button[aria-checked="true"] {
        background: var(--fg);
        color: #1e1d1b;
      }
      #admin .arow {
        display: flex;
        gap: 8px;
      }
      #admin .arow input {
        flex: 1;
        min-width: 0;
      }
      #admin .ause {
        padding: 0 16px;
        border-radius: 10px;
      }
      #admin .areset {
        align-self: flex-start;
        font: 400 13px var(--font);
        color: var(--muted);
        background: none;
        border: 0;
        padding: 4px 0;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      /* operator strip: small and quiet */
      #ops {
        position: absolute;
        left: 16px;
        bottom: 10px;
        z-index: 4;
        display: flex;
        gap: 10px;
        align-items: center;
        opacity: 0.5;
        transition: opacity 0.2s;
      }
      #ops:hover,
      #ops:focus-within {
        opacity: 1;
      }
      #status {
        font: 12px var(--mono);
        color: var(--ink2);
        max-width: 50vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #ops button {
        font: 500 12px var(--mono);
        background: rgba(0, 0, 0, 0.4);
        color: #eee;
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
      }
      #ops button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="imgA" class="paint" alt="The crowd painting" />
      <img id="imgB" class="paint" alt="" style="opacity: 0" />
      <div id="label">
        <b>Momento</b><span id="sub">How do you feel today?</span>
      </div>
      <div id="strip"></div>
      <div id="caption">
        <span class="q" id="capWords"></span><small id="capMeta"></small>
      </div>

      <div id="veil">
        <canvas id="silk" aria-hidden="true"></canvas>
        <div class="card">
          <div class="brand">Momento</div>
          <!-- 1 · the question -->
          <section class="scr" id="s-ask" aria-labelledby="qBig">
            <h1 class="q-big" id="qBig">How do you feel today?</h1>
            <input
              id="typed"
              class="hidden"
              maxlength="200"
              autocomplete="off"
              placeholder="No mic here? Type what you'd say"
            />
            <button class="go" id="btnGo" disabled>Start</button>
          </section>
          <!-- 2 · 3 · 2 · 1 -->
          <section class="scr off" id="s-count" aria-live="assertive">
            <p class="n" id="n">3</p>
          </section>
          <!-- 3 · camera with live voice and movement -->
          <section class="scr off" id="s-cap">
            <div class="cap">
              <div id="camwrap">
                <video id="cam" playsinline muted></video>
                <canvas id="skel" width="320" height="180"></canvas>
                <span class="rec"><span id="secs">10</span></span>
                <div id="transcript"></div>
                <div class="timebar"><i id="timebar"></i></div>
              </div>
              <div class="meters">
                <span class="ml">Vol</span
                ><canvas id="cvVoice" aria-label="Your voice"></canvas>
                <span class="ml">Move</span
                ><canvas id="cvMove" aria-label="Your movement"></canvas>
              </div>
            </div>
          </section>
        </div>
      </div>

      <!-- operator -->
      <div id="ops">
        <button id="btnEvent" title="Name the event and choose the question">
          Event
        </button>
        <button id="btnSim" title="Test the pipeline without a person">
          Simulate
        </button>
        <button
          id="btnMeter"
          title="Switch the live meters between bars and slider"
          hidden
        >
          Meters: bars
        </button>
        <span id="status">Starting…</span>
      </div>
    </div>

    <aside id="admin" aria-label="Event setup" hidden>
      <div class="ahead">
        <b>Event setup</b
        ><button
          class="aclose"
          id="adminClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
      </div>
      <label for="evName">What's the event?</label>
      <input
        id="evName"
        type="text"
        autocomplete="off"
        placeholder="Duke hackathon, Maya &amp; Sam's wedding, a music festival"
      />
      <label for="evVibe">Anything about the crowd or mood? (optional)</label>
      <input
        id="evVibe"
        type="text"
        autocomplete="off"
        placeholder="tired coders at 2am, family and old friends"
      />
      <button class="agen" id="genBtn" type="button">
        Write questions with AI
      </button>
      <p class="astatus" id="aStatus" aria-live="polite"></p>
      <div
        class="aopts"
        id="aOpts"
        role="radiogroup"
        aria-label="Question options"
      ></div>
      <label for="evCustom">Or write your own</label>
      <div class="arow">
        <input
          id="evCustom"
          type="text"
          autocomplete="off"
          placeholder="How do you feel today?"
        /><button class="ause" id="useCustom" type="button">Use</button>
      </div>
      <button class="areset" id="resetQ" type="button">
        Back to "How do you feel today?"
      </button>
    </aside>

    <script>
      // Charcoal satin: a slow silk surface behind the card. Neutral on purpose, so the only color anyone sees is the painting.
      (function () {
        const cv = document.getElementById("silk"),
          gl = cv.getContext("webgl", { antialias: false });
        if (!gl) return;
        const FS = `precision highp float; varying vec2 vUv; uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
  float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.02+vec2(3.1,7.7); a*=0.5; } return v; }
  float H(vec2 p){ float t=uTime*0.15; vec2 m=uMouse*vec2(uRes.x/uRes.y,1.0); float d=length(p-m);
    float h=sin(p.x*4.2+sin(p.y*2.3+t)*2.0+t)*0.5+sin(p.y*6.51+p.x*1.6-t*1.2)*0.2+fbm(p*1.5+t*0.2)*0.15;
    return h+0.12*exp(-d*d*6.0)*sin(d*10.0-uTime*1.2); }
  void main(){ vec2 asp=vec2(uRes.x/uRes.y,1.0), p=vUv*asp; float e=1.5/uRes.y;
    float h=H(p), hx=H(p+vec2(e,0.0)), hy=H(p+vec2(0.0,e)); vec3 n=normalize(vec3((h-hx)/e*0.7,(h-hy)/e*0.7,1.0));
    float key=max(dot(n,normalize(vec3(-0.6,0.5,0.6))),0.0); vec2 lm=uMouse*asp-p; vec3 L=normalize(vec3(lm,0.5)); float fall=1.0/(1.0+dot(lm,lm)*4.0);
    float spec=pow(max(dot(reflect(-L,n),vec3(0,0,1)),0.0),10.0)*fall;
    vec3 c=vec3(0.07,0.066,0.062)+vec3(0.13,0.125,0.118)*key+vec3(0.30,0.28,0.26)*spec;
    gl_FragColor=vec4(c*(0.97+0.05*hash(gl_FragCoord.xy+fract(uTime))),1.0); }`;
        const sh = (t, src) => {
          const s = gl.createShader(t);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        };
        const pr = gl.createProgram();
        gl.attachShader(
          pr,
          sh(
            gl.VERTEX_SHADER,
            "attribute vec2 a; varying vec2 vUv; void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.0,1.0); }",
          ),
        );
        gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(pr);
        gl.useProgram(pr);
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        const a = gl.getAttribLocation(pr, "a");
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
        const uRes = gl.getUniformLocation(pr, "uRes"),
          uTime = gl.getUniformLocation(pr, "uTime"),
          uMouse = gl.getUniformLocation(pr, "uMouse");
        const rs = () => {
          const d = Math.min(devicePixelRatio || 1, 1.25);
          cv.width = Math.round(innerWidth * d);
          cv.height = Math.round(innerHeight * d);
          gl.viewport(0, 0, cv.width, cv.height);
        };
        addEventListener("resize", rs);
        rs();
        let mx = -1,
          my = -1;
        const M = { x: 0.5, y: 0.55 };
        addEventListener("pointermove", (e) => {
          mx = e.clientX / innerWidth;
          my = 1 - e.clientY / innerHeight;
        });
        const veil = document.getElementById("veil");
        (function loop(t) {
          t /= 1000;
          if (!veil.classList.contains("off")) {
            const tx = mx < 0 ? 0.5 + Math.sin(t * 0.25) * 0.25 : mx,
              ty = my < 0 ? 0.55 + Math.cos(t * 0.2) * 0.12 : my;
            M.x += (tx - M.x) * 0.08;
            M.y += (ty - M.y) * 0.08;
            gl.uniform2f(uRes, cv.width, cv.height);
            gl.uniform1f(uTime, t);
            gl.uniform2f(uMouse, M.x, M.y);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          }
          requestAnimationFrame(loop);
        })(0);
      })();
    </script>

    <script type="module">
      const $ = (s) => document.querySelector(s);
      const clamp = (v, a = -1, b = 1) => Math.max(a, Math.min(b, v));
      const lin = (v, lo, hi) => clamp(((v - lo) / (hi - lo)) * 2 - 1); // map [lo,hi] -> [-1,1]
      const CAPTURE_MS = 10000;
      let busy = false;

      // ---------------- visitor screens ----------------
      function screen(name) {
        for (const s of ["ask", "count", "cap"])
          $("#s-" + s).classList.toggle("off", s !== name);
        const open = name !== "none";
        $("#veil").classList.toggle("off", !open);
        $("#label").style.visibility = open ? "hidden" : "";
        $("#strip").style.visibility = open ? "hidden" : "";
      }

      // ---------------- event setup: the operator names the event, AI writes the question ----------------
      // Tries the booth server first (POST /api/question {event, vibe} -> {questions:[...]}). If that endpoint isn't there yet,
      // it falls back to built-in suggestions for the kind of event, and the operator can always type their own.
      const DEFAULT_Q = "How do you feel today?";
      function setQuestion(t) {

      const openAdmin = (v) => {

      $("#admin").addEventListener("keydown", (e) => {

      $("#genBtn").onclick = async () => {

      $("#resetQ").onclick = () => {

      async function countdown() {
        screen("count");
        for (const n of [3, 2, 1]) {

      // ---------------- painting display ----------------
      let front = $("#imgA"),
        back = $("#imgB");
      function showPainting(src) {
        return new Promise((res) => {

      function addThumb(src) {

      const status = (t) => {

      };

      // ---------------- camera + pose (Laban effort from wrists) ----------------
      const video = $("#cam"),
        sk = $("#skel").getContext("2d");
      let pose = null,
        camOK = false,
        track = []; // track: {t, l:[x,y]|null, r:[x,y]|null}
      async function initCamera() {
        try {
          video.srcObject = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 360 },
            audio: false,
          });
          await video.play();
          camOK = true;
          const { FilesetResolver, PoseLandmarker } =
            await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
          const fs = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",
          );
          pose = await PoseLandmarker.createFromOptions(fs, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
              delegate: "GPU",
            },
            runningMode: "VIDEO",
            numPoses: 1,
          });
        } catch (e) {
          console.warn("camera/pose unavailable", e);
        }
      }
      let lastVT = -1,
        capturing = false;
      function poseLoop(now) {
        if (pose && video.readyState >= 2 && video.currentTime !== lastVT) {
          lastVT = video.currentTime;
          const r = pose.detectForVideo(video, now),
            L = r.landmarks?.[0];
          sk.clearRect(0, 0, 320, 180);
          if (L) {
            // shoulders, elbows, wrists: arms drawn as lines, wrists as larger dots, so people see the booth following them
            const seg = [
              [11, 13],
              [13, 15],
              [12, 14],
              [14, 16],
              [11, 12],
            ];
            sk.strokeStyle = COL.Move;
            sk.lineWidth = 2;
            sk.lineCap = "round";
            for (const [a, b] of seg) {
              const p = L[a],
                q = L[b];
              if (p.visibility > 0.5 && q.visibility > 0.5) {
                sk.beginPath();
                sk.moveTo(p.x * 320, p.y * 180);
                sk.lineTo(q.x * 320, q.y * 180);
                sk.stroke();
              }
            }
            sk.fillStyle = COL.Voice;
            for (const i of [11, 12, 13, 14, 15, 16]) {
              const p = L[i];
              if (p.visibility > 0.5) {
                sk.beginPath();
                sk.arc(p.x * 320, p.y * 180, i > 14 ? 5 : 3, 0, 7);
                sk.fill();
              }
            }
            if (capturing)
              track.push({
                t: now / 1000,
                l: L[15].visibility > 0.5 ? [L[15].x, L[15].y] : null,
                r: L[16].visibility > 0.5 ? [L[16].x, L[16].y] : null,
              });
          }
          if (capturing) {
            const f = labanFrom(track.slice(-30));
            setMeter("Move", f.motion);
          }
        }
        requestAnimationFrame(poseLoop);
      }

      /** Laban effort from wrist paths (normalized image coords, seconds).
       *  weight: peak acceleration (light .. strong) · time: share of sudden accelerations (sustained .. sudden)
       *  space: path straightness over 1 s windows (indirect .. direct) · flow: range of motion (bound .. free) */
      // Centered moving average over ±k samples. Landmark jitter is amplified twice by differentiating to acceleration,
      // so without this every movement read as maximally strong and sudden (calibration run 1: all Laban values pinned at ±1).
      function smoothPath(s, k = 2) {
        return s.map((f, i) => {
          let x = 0,
            y = 0,
            n = 0;
          for (
            let j = Math.max(0, i - k);
            j <= Math.min(s.length - 1, i + k);
            j++
          ) {
            x += s[j].p[0];
            y += s[j].p[1];
            n++;
          }
          return { t: f.t, p: [x / n, y / n] };
        });
      }
      function labanFrom(tr) {
        const out = {
          weight: 0,
          time: 0,
          space: 0,
          flow: 0,
          motion: 0,
          detected: false,
          still: false,
          raw: null,
        };
        const accs = [],
          speeds = [],
          straight = [],
          pts = [];
        for (const side of ["l", "r"]) {
          const s = smoothPath(
            tr.filter((f) => f[side]).map((f) => ({ t: f.t, p: f[side] })),
          );
          if (s.length < 8) continue;
          out.detected = true;
          let v = [];
          for (let i = 1; i < s.length; i++) {
            const dt = Math.max(1 / 60, s[i].t - s[i - 1].t);
            v.push({
              t: s[i].t,
              v: [
                (s[i].p[0] - s[i - 1].p[0]) / dt,
                (s[i].p[1] - s[i - 1].p[1]) / dt,
              ],
            });
            pts.push(s[i].p);
          }
          v = v.map((x, i) => {
            const a = v[Math.max(0, i - 1)],
              b = v[Math.min(v.length - 1, i + 1)];
            return {
              t: x.t,
              v: [
                (a.v[0] + x.v[0] + b.v[0]) / 3,
                (a.v[1] + x.v[1] + b.v[1]) / 3,
              ],
            };
          });
          for (let i = 1; i < v.length; i++) {
            const dt = Math.max(1 / 60, v[i].t - v[i - 1].t);
            accs.push(
              Math.hypot(v[i].v[0] - v[i - 1].v[0], v[i].v[1] - v[i - 1].v[1]) /
                dt,
            );
          }
          for (const x of v) speeds.push(Math.hypot(...x.v));
          for (let i = 0; i + 30 < s.length; i += 15) {
            let path = 0;
            for (let k = i + 1; k <= i + 30; k++)
              path += Math.hypot(
                s[k].p[0] - s[k - 1].p[0],
                s[k].p[1] - s[k - 1].p[1],
              );
            const disp = Math.hypot(
              s[i + 30].p[0] - s[i].p[0],
              s[i + 30].p[1] - s[i].p[1],
            );
            if (path > 0.05) straight.push(disp / path);
          }
        }
        if (!out.detected) {
          // Body visible but hands out of frame or down at the sides: that's stillness, not absence (calibration run 1).
          if (tr.length >= 30)
            Object.assign(out, {
              detected: true,
              still: true,
              weight: -0.6,
              time: -0.7,
              space: 0,
              flow: -0.3,
              motion: 0,
            });
          return out;
        }
        const sorted = accs.slice().sort((a, b) => a - b),
          p95 = sorted[Math.floor(sorted.length * 0.95)] || 0;
        const meanSpeed =
          speeds.reduce((a, b) => a + b, 0) / Math.max(1, speeds.length);
        const xs = pts.map((p) => p[0]),
          ys = pts.map((p) => p[1]);
        const extent = Math.hypot(
          Math.max(...xs) - Math.min(...xs),
          Math.max(...ys) - Math.min(...ys),
        );
        const sudden =
          accs.filter((a) => a > 10).length / Math.max(1, accs.length);
        const straightness = straight.length
          ? straight.reduce((a, b) => a + b, 0) / straight.length
          : null;
        // Ranges fit to four calibration runs (small / normal / loud-animated gave p95 20.7 / 38.9 / 46.5,
        // sudden .16 / .32 / .88, straightness .58 / .22 / .20, extent 1.07 / 1.22 / 1.70, speed .47 / .84 / 2.57).
        // Extent pools both wrists, so it includes the distance between the hands; hence the high floor.
        out.weight = lin(p95, 12, 50);
        out.time = lin(sudden, 0.05, 0.75);
        out.space = straightness == null ? 0 : lin(straightness, 0.15, 0.75);
        out.flow = lin(extent, 0.9, 1.8);
        out.motion = clamp(meanSpeed / 2.5, 0, 1);
        out.raw = {
          p95: +p95.toFixed(2),
          sudden: +sudden.toFixed(3),
          straightness: straightness == null ? null : +straightness.toFixed(2),
          extent: +extent.toFixed(2),
          speed: +meanSpeed.toFixed(2),
          samples: pts.length,
        };
        return out;
      }

      // ---------------- mic: vocal arousal from loudness, pitch movement and syllable rate ----------------
      let audio = null,
        frames = [];
      async function initMic() {
        try {
          // Browser voice processing evens out volume (small and normal voice both measured ~-29 dB), so turn it off:
          // loudness is the main arousal signal and has to be the real one.
          const stream = await navigator.mediaDevices.getUserMedia({
            video: false,
            audio: {
              autoGainControl: false,
              noiseSuppression: false,
              echoCancellation: false,
            },
          });
          const ctx = new AudioContext(),
            src = ctx.createMediaStreamSource(stream),
            an = ctx.createAnalyser();
          an.fftSize = 2048;
          src.connect(an);
          audio = { ctx, an, buf: new Float32Array(2048) };
        } catch (e) {
          console.warn("mic unavailable", e);
        }
      }
      // Normalized autocorrelation pitch, 80-400 Hz. Takes the SHORTEST lag within 90% of the best peak: raw "max peak"
      // often lands on a multiple of the true period (octave errors), which inflated pitch spread to 6-7 semitones.
      function pitchOf(buf, sr) {
        const N = 1024,
          lo = Math.floor(sr / 400),
          hi = Math.floor(sr / 80),
          r = new Float32Array(hi + 1);
        let e0 = 0;
        for (let i = 0; i < N; i++) e0 += buf[i] * buf[i];
        let best = 0;
        for (let lag = lo; lag <= hi; lag++) {
          let c = 0,
            e1 = 0;
          for (let i = 0; i < N; i++) {
            c += buf[i] * buf[i + lag];
            e1 += buf[i + lag] * buf[i + lag];
          }
          r[lag] = c / Math.sqrt(e0 * e1 + 1e-12);
          if (r[lag] > best) best = r[lag];
        }
        if (best < 0.5) return 0; // not clearly periodic: treat as unvoiced
        for (let lag = lo + 1; lag < hi; lag++)
          if (
            r[lag] >= 0.9 * best &&
            r[lag] >= r[lag - 1] &&
            r[lag] >= r[lag + 1]
          )
            return sr / lag;
        return 0;
      }
      function audioTick() {
        if (!audio || !capturing) return;
        audio.an.getFloatTimeDomainData(audio.buf);
        let s = 0;
        for (const x of audio.buf) s += x * x;
        const db = 10 * Math.log10(s / audio.buf.length + 1e-10),
          voiced = db > -45;
        frames.push({
          t: performance.now() / 1000,
          db,
          f0: voiced ? pitchOf(audio.buf, audio.ctx.sampleRate) : 0,
        });
        setMeter("Voice", clamp((db + 55) / 35, 0, 1));
      }
      function prosodyFrom(fr) {
        const v = fr.filter((f) => f.f0 > 0);
        if (v.length < 5)
          return {
            arousal: 0.3,
            loud: null,
            pitchVar: null,
            rate: null,
            voiced: v.length / Math.max(1, fr.length),
          };
        const loud = v.reduce((a, f) => a + f.db, 0) / v.length;
        const all = v
            .map((f) => 12 * Math.log2(f.f0 / 100))
            .sort((a, b) => a - b),
          med = all[Math.floor(all.length / 2)];
        const semis = all.filter((s) => Math.abs(s - med) <= 7); // drop leftover octave jumps before measuring spread
        const m = semis.reduce((a, b) => a + b, 0) / Math.max(1, semis.length);
        const pitchVar = Math.sqrt(
          semis.reduce((a, b) => a + (b - m) ** 2, 0) /
            Math.max(1, semis.length),
        );
        let peaks = 0;
        for (let i = 1; i < fr.length - 1; i++)
          if (
            fr[i].db > -40 &&
            fr[i].db > fr[i - 1].db + 3 &&
            fr[i].db >= fr[i + 1].db
          )
            peaks++;
        const dur = fr[fr.length - 1].t - fr[0].t || 1,
          rate = peaks / dur;
        // Fit with browser voice processing off: whisper -40.8 dB, loud -24.2 dB. Loudness carries it. Pitch spread is
        // unreliable on quiet voices (the whisper measured 2.9 semitones vs 2.5 loud) and rate barely moved, so both are minor.
        const arousal = clamp(
          (0.75 * (lin(loud, -41, -25) + 1)) / 2 +
            (0.1 * (lin(pitchVar, 1.8, 3.4) + 1)) / 2 +
            (0.15 * (lin(rate, 1, 2.6) + 1)) / 2,
          0,
          1,
        );
        return {
          arousal,
          loud: +loud.toFixed(1),
          pitchVar: +pitchVar.toFixed(2),
          rate: +rate.toFixed(2),
          voiced: +(v.length / fr.length).toFixed(2),
        };
      }

      // ---------------- speech to text (Chrome) ----------------
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        finalText = "",
        interim = "";
      function startSpeech() {
        finalText = "";
        interim = "";
        if (!SR) return;
        rec = new SR();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = "en-US";
        rec.onresult = (e) => {
          interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalText += t + " ";
            else interim += t;
          }
          const n = (finalText + interim)
            .trim()
            .split(/\s+/)
            .filter(Boolean).length; // words stay private: show a count
          $("#transcript").textContent = n
            ? `hearing you · ${n} word${n === 1 ? "" : "s"}`
            : "";
        };
        rec.onerror = (e) => console.warn("speech", e.error);
        try {
          rec.start();
        } catch {}
      }
      // Chrome delivers the last final result shortly after stop(); wait for onend (max 1.2 s) so the caption isn't cut off.
      function stopSpeech() {
        if (!rec) return Promise.resolve((finalText + " " + interim).trim());
        return new Promise((res) => {
          const done = () => res((finalText + " " + interim).trim());
          const timer = setTimeout(done, 1200);
          rec.onend = () => {
            clearTimeout(timer);
            done();
          };
          try {
            rec.stop();
          } catch {
            clearTimeout(timer);
            done();
          }
        });
      }

      // ---------------- live meters: scrolling bars (default) or slider ----------------
      // setMeter keeps the same signature the capture code already calls; drawing happens in meterLoop.
      const level = { Voice: 0, Move: 0 },
        N = 64,
        hist = { Voice: new Array(N).fill(0), Move: new Array(N).fill(0) };
      var COL = { Voice: "#F1EDE6", Move: "#F1EDE6" };
      let meterStyle =
          new URLSearchParams(location.search).get("meter") === "slider"
            ? "slider"
            : "bars",
        lastPush = 0;
      function setMeter(k, v) {
        level[k] = v;
      }
      function fit(cv) {
        const d = Math.min(devicePixelRatio || 1, 2),
          w = cv.clientWidth * d,
          h = cv.clientHeight * d;
        if (cv.width !== w || cv.height !== h) {
          cv.width = w;
          cv.height = h;
        }
        return cv.getContext("2d");
      }
      function drawMeter(cv, k) {
        const g = fit(cv),
          W = cv.width,
          H = cv.height,
          col = COL[k];
        g.clearRect(0, 0, W, H);
        if (meterStyle === "bars") {
          const gap = W / N,
            bw = Math.max(2, gap * 0.55);
          for (let i = 0; i < N; i++) {
            const v = hist[k][i],
              h = Math.max(H * 0.06, v * H * 0.95),
              x = i * gap + (gap - bw) / 2;
            g.globalAlpha = 1 - 0.75 * (i / N);
            g.fillStyle = col;
            g.fillRect(x, (H - h) / 2, bw, h);
          }
          g.globalAlpha = 1;
        } else {
          const y = H / 2,
            pad = H * 0.32,
            x = pad + level[k] * (W - 2 * pad);
          g.lineWidth = H * 0.14;
          g.lineCap = "round";
          g.strokeStyle =
            getComputedStyle(document.documentElement).getPropertyValue(
              "--line",
            ) || "rgba(0,0,0,.15)";
          g.beginPath();
          g.moveTo(pad, y);
          g.lineTo(W - pad, y);
          g.stroke();
          g.strokeStyle = col;
          g.beginPath();
          g.moveTo(pad, y);
          g.lineTo(x, y);
          g.stroke();
          g.fillStyle = col;
          g.beginPath();
          g.arc(x, y, H * 0.3, 0, 7);
          g.fill();
        }
      }
      function meterLoop(now) {
        if (now - lastPush > 50) {
          lastPush = now;
          for (const k of ["Voice", "Move"]) {
            hist[k].unshift(capturing ? level[k] : 0);
            hist[k].pop();
          }
        }
        if (!$("#s-cap").classList.contains("off")) {
          drawMeter($("#cvVoice"), "Voice");
          drawMeter($("#cvMove"), "Move");
        }
        requestAnimationFrame(meterLoop);
      }
      $("#btnMeter").onclick = () => {
        meterStyle = meterStyle === "bars" ? "slider" : "bars";
        $("#btnMeter").textContent = "Meters: " + meterStyle;
      };
      $("#btnMeter").textContent = "Meters: " + meterStyle;

      // ---------------- a visit ----------------
      async function capture() {
        track = [];
        frames = [];
        level.Voice = level.Move = 0;
        hist.Voice.fill(0);
        hist.Move.fill(0);
        $("#transcript").textContent = "";
        $("#timebar").style.width = "0";
        screen("cap");
        capturing = true;
        startSpeech();
        status("Listening and watching");
        const t0 = performance.now(),
          audioTimer = setInterval(audioTick, 50);
        await new Promise((res) => {
          const tick = () => {
            const p = Math.min(1, (performance.now() - t0) / CAPTURE_MS);
            $("#timebar").style.width = p * 100 + "%";
            $("#secs").textContent = Math.max(0, Math.ceil((1 - p) * 10));
            p >= 1 ? res() : requestAnimationFrame(tick);
          };
          tick();
        });
        capturing = false;
        clearInterval(audioTimer);
        let transcript = await stopSpeech();
        if (!transcript && !$("#typed").classList.contains("hidden"))
          transcript = $("#typed").value.trim();
        return {
          transcript,
          prosody: prosodyFrom(frames),
          laban: labanFrom(track),
        };
      }

      async function sendVisit(v) {
        busy = true;
        $("#btnGo").disabled = true;
        $("#btnSim").disabled = true;
        screen("none"); // lift the veil: the painting answers
        $("#sub").textContent = "Reading you… then painting";
        status("Reading you… then painting");
        try {
          const r = await fetch("/api/visit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(v),
          }).then((r) => r.json());
          if (r.error) throw new Error(r.error);
          const d = r.director,
            i = r.info;
          // Privacy: the big screen never shows a visitor's words, only the director's museum-style reading.
          const reading = (d.reading || "").trim();
          $("#capWords").textContent = reading
            ? reading[0].toUpperCase() + reading.slice(1)
            : "A moment without words";
          // Hybrid placement names the paintings in the visitor's mix; axes-only falls back to the nearest paintings.
          const mixText = (list) =>
            list.map(([n, w]) => `${Math.round(w * 100)}% ${n}`).join(" · ");
          const axesText = `energy ${d.energy.toFixed(1)}, warmth ${d.temperature.toFixed(1)}, light ${d.value.toFixed(1)}`;
          $("#capMeta").textContent =
            i.you_mix && i.you_mix.length
              ? `${mixText(i.you_mix)} · ${axesText}`
              : `closest to ${i.you_nearest.join(" and ")} · ${axesText}`;
          $("#caption").classList.add("on");
          $("#sub").textContent = "Your moment";
          await showPainting(r.moment);
          addThumb(r.moment);
          status(
            `Director: ${d.source} in ${r.timing.director_s}s · painting ${r.timing.gpu_s}s · visitor ${i.n}`,
          );
          await new Promise((res) => setTimeout(res, 7000));
          $("#caption").classList.remove("on");
          $("#sub").textContent =
            `The crowd after ${i.n} visitor${i.n === 1 ? "" : "s"} · ` +
            (i.crowd_mix && i.crowd_mix.length
              ? mixText(i.crowd_mix)
              : `closest to ${i.crowd_nearest.join(" and ")}`);
          await showPainting(r.crowd);
          await new Promise((res) => setTimeout(res, 4000)); // let the crowd painting breathe before the next person
        } catch (e) {
          status("Something went wrong: " + e.message);
          $("#sub").textContent = "How do you feel today?";
          console.error(e);
        }
        busy = false;
        $("#btnGo").disabled = false;
        $("#btnSim").disabled = false;
        $("#typed").value = "";
        screen("ask");
        $("#btnGo").focus({ preventScroll: true });
      }

      // The booth card asks, counts down and captures; then the visitor draws on the vibe page (/vibe), which skips its
      // own listening step, uses this capture for the mood palette, and comes back here when the drawing is done.
      // Set false to go back to the booth's own crowd painting (/api/visit) after the capture.
      const DRAW_AFTER_BOOTH = true;
      function handoffToVibe(v) {
        try {
          sessionStorage.setItem(
            "booth-visit",
            JSON.stringify({
              t: Date.now(),
              feeling: v.transcript || "",
              arousal: v.prosody.arousal,
              levels: frames.map((f) => f.db), // loudness over the 10 s, for the vibe stroke's strength
              laban: v.laban,
            }),
          );
        } catch (e) {
          console.warn("handoff not stored; using the booth painting", e);
          return sendVisit(v);
        }
        screen("none");
        $("#sub").textContent = "Now draw your mood";
        location.href = "/vibe?from=booth";
      }

      $("#btnGo").onclick = async () => {
        if (busy) return;
        busy = true;
        $("#btnGo").disabled = true;
        await countdown();
        const v = await capture();
        busy = false;
        DRAW_AFTER_BOOTH ? handoffToVibe(v) : sendVisit(v);
      };
      $("#typed").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !$("#btnGo").disabled) $("#btnGo").click();
      });
      addEventListener("keydown", (e) => {
        if (
          e.code === "Space" &&
          e.target.tagName !== "INPUT" &&
          e.target.tagName !== "BUTTON" &&
          !$("#btnGo").disabled &&
          !$("#s-ask").classList.contains("off")
        ) {
          e.preventDefault();
          $("#btnGo").click();
        }
      });
      const SIMS = [
        {
          transcript: "Missing my grandma tonight.",
          prosody: { arousal: 0.15 },
          laban: {
            weight: -0.7,
            time: -0.8,
            space: -0.6,
            flow: 0.6,
            detected: true,
          },
        },
        {
          transcript: "I'm angry about how things are going.",
          prosody: { arousal: 0.95 },
          laban: {
            weight: 0.9,
            time: 0.9,
            space: 0.9,
            flow: -0.9,
            detected: true,
          },
        },
        {
          transcript: "Everyone I love is in this room right now!",
          prosody: { arousal: 0.8 },
          laban: {
            weight: -0.6,
            time: 0.7,
            space: -0.5,
            flow: 0.8,
            detected: true,
          },
        },
        {
          transcript: "First snow of the year on the walk here.",
          prosody: { arousal: 0.3 },
          laban: {
            weight: -0.6,
            time: -0.5,
            space: -0.4,
            flow: 0.5,
            detected: true,
          },
        },
      ];
      let simI = 0;
      $("#btnSim").onclick = () => {
        if (!busy) sendVisit(SIMS[simI++ % SIMS.length]);
      };

      // ---------------- boot ----------------
      (async () => {
        screen("ask");
        requestAnimationFrame(meterLoop);
        status("Connecting to the painting…");
        try {
          const h = await fetch("/api/health").then((r) => r.json());
          if (h.lab !== "ok") {
            status("GPU lab is not reachable: " + h.lab);
          }
          const cur = await fetch("/api/current", { method: "POST" }).then(
            (r) => r.json(),
          );
          if (cur.crowd) {
            await showPainting(cur.crowd);
            $("#sub").textContent = cur.n
              ? `The crowd after ${cur.n} visitors`
              : "How do you feel today?";
          }
          status(`Ready · director: ${h.director}`);
        } catch (e) {
          status("Booth server error: " + e.message);
        }
        await Promise.all([initCamera(), initMic()]);
        // visitors never type: no text box even without a mic
        status(
          `${$("#status").textContent} · camera ${pose ? "on" : "off"} · mic ${audio ? "on" : "off"} · speech ${SR ? "on" : "off"}`,
        );
        $("#btnGo").disabled = false;
        requestAnimationFrame(poseLoop);
      })();
    </script>
  </body>
</html>
